<section id="authGate" class="auth-gate" aria-labelledby="authTitle">
 <div class="auth-card">
  <img src="./icon.svg" width="76" height="76" alt="شعار PDF.ATHAT">
  <p class="auth-brand">PDF.ATHAT</p>
  <h1 id="authTitle">أهلًا بعودتك</h1>
  <p id="authIntro">سجّل الدخول إلى مساحتك بالإيميل وكلمة المرور.</p>
  <div class="auth-tabs" id="authTabs" role="group" aria-label="الحساب">
   <button type="button" data-auth-mode="login" aria-pressed="true">تسجيل الدخول</button>
   <button type="button" data-auth-mode="signup" aria-pressed="false">حساب جديد</button>
  </div>
  <p id="authService" class="auth-notice" role="status" hidden></p>
  <form id="authForm">
   <label id="authEmailLabel" for="authEmail">البريد الإلكتروني
    <input id="authEmail" name="email" type="email" autocomplete="username" dir="ltr" maxlength="254" required placeholder="name@example.com">
   </label>
   <label id="authCodeLabel" for="authCode" hidden>رمز التحقق
    <input id="authCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" dir="ltr" pattern="[0-9]{6}" maxlength="6" placeholder="000000">
   </label>
   <label id="authPasswordLabel" for="authPassword">كلمة المرور
    <input id="authPassword" name="password" type="password" autocomplete="current-password" dir="auto" maxlength="128" required>
   </label>
   <label id="authConfirmLabel" for="authConfirm" hidden>تأكيد كلمة المرور
    <input id="authConfirm" name="confirm" type="password" autocomplete="new-password" dir="auto" maxlength="128">
   </label>
   <p id="authPasswordHint" class="auth-hint" hidden>استخدم 12 حرفًا على الأقل. يمكنك استخدام عبارة طويلة يسهل تذكرها.</p>
   <p id="authMessage" role="status" aria-live="polite"></p>
   <button id="authSubmit" type="submit" class="auth-primary" disabled>جارٍ التحقق من الجلسة…</button>
  </form>
  <button id="authForgot" class="auth-link" type="button">نسيت كلمة المرور؟</button>
  <button id="authBack" class="auth-link" type="button" hidden>العودة لتسجيل الدخول</button>
  <p class="auth-privacy">ملفاتك محفوظة محليًا على هذا الجهاز، في مكتبة منفصلة لكل حساب. الحساب لا يزامن الملفات بين الأجهزة.</p>
  <noscript>فعّل JavaScript لاستخدام الموقع وتسجيل الدخول.</noscript>
 </div>
</section>
