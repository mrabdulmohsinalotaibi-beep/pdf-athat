name: Validate PDF.ATHAT
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app.js
      - run: test -s index.html && test -s style.css && test -s manifest.webmanifest

      - run: node --check server/auth.mjs && node --check web/auth.js
      - run: node tests/auth.test.mjs && node tests/auth-build.test.cjs
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm run test:offline && node scripts/build-site.cjs
        working-directory: desktop
