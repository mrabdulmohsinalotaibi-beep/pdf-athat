name: PDF account and admin checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'functions/api/**'
      - 'migrations/**'
      - 'desktop/scripts/build-site.cjs'
      - 'account.*'
      - 'tests/account-profile.test.cjs'
      - 'admin.*'
      - 'site-ads.*'
      - 'tests/ads.test.mjs'
      - 'traffic.js'
      - 'tests/traffic.test.mjs'
      - 'tests/theme-cycle.test.cjs'
      - '_headers'
      - 'site-entry.js'
      - 'prayer-bar.*'
      - 'peer-sync.js'
      - 'tests/peer-sync.test.mjs'
      - 'app-v2.js'
      - 'index.html'
      - 'tests/header-layout.test.cjs'
      - 'tests/cover-quality.test.cjs'
      - 'tests/device-layout.test.cjs'
      - 'style.css'
      - 'tests/reader-hardening.test.cjs'
      - 'legacy-import.js'
      - 'tests/auth.test.mjs'
      - '.github/workflows/account-check.yml'
  workflow_dispatch:
jobs:
  auth-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed-in personal account and no-redirect tests
        run: node --test tests/account-profile.test.cjs
      - name: Account page script syntax
        run: node --check account.js
      - name: Authentication and username tests
        run: node --test tests/auth.test.mjs
      - name: Responsive header and original logo regression tests
        run: node --test tests/header-layout.test.cjs
      - name: Phone tablet and desktop layout stability regression tests
        run: node --test tests/device-layout.test.cjs
      - name: Sharp PDF covers and full-page preview regression tests
        run: node --test tests/cover-quality.test.cjs
      - name: Ad scheduling, access and safe rendering tests
        run: node --test tests/ads.test.mjs
      - name: Private traffic analytics, security headers and appearance button tests
        run: |
          node --test tests/traffic.test.mjs
          node --test tests/theme-cycle.test.cjs
          node --check traffic.js
          node --check 'functions/api/traffic/visit.js'
      - name: Peer-to-peer signaling and same-account isolation tests
        run: node --test tests/peer-sync.test.mjs
      - name: Encrypted backup, search and local privacy tests
        run: node --test tests/reader-hardening.test.cjs
      - name: Check admin and prayer scripts
        run: |
          node --check admin.js
          node --check site-ads.js
          node --check functions/api/ads.js
          node --check prayer-bar.js
          node --check peer-sync.js
          node --check 'functions/api/sync/[[path]].js'
      - name: Install dependencies
        run: cd desktop && npm install --ignore-scripts --no-audit --no-fund
      - name: Offline PDF build
        run: cd desktop && npm run build:offline
      - name: Validate prayer UI JavaScript
        run: node --check prayer-bar.js
      - name: Website build with account gate
        run: node desktop/scripts/build-site.cjs
      - name: Verify web entry point
        run: |
          test -f desktop/dist/account.html
          grep -q 'id="profilePane"' desktop/dist/account.html
          grep -q 'showProfile(data.user)' desktop/dist/account.js
          test -f desktop/dist/admin.html
          test -f desktop/dist/traffic.js
          test -f desktop/dist/_headers
          grep -q 'traffic.js?v=' desktop/dist/index.html
          grep -q 'traffic.js?v=' desktop/dist/account.html
          grep -q 'traffic.js?v=' desktop/dist/admin.html
          test -f desktop/dist/site-ads.js
          test -f desktop/dist/site-ads.css
          grep -q 'site-ads.js' desktop/dist/site-entry.js
          test -f desktop/dist/prayer-bar.js
          test -f desktop/dist/peer-sync.js
          grep -q 'peer-sync.js' desktop/dist/site-entry.js
          grep -q 'backupCryptoVersion' desktop/dist/app-v2.js
          grep -q 'installNotesHub' desktop/dist/app-v2.js
          test -f desktop/dist/prayer-bar.css
          grep -q 'prayer-bar.css' desktop/dist/index.html
          grep -q 'class="brand-home-button"' desktop/dist/index.html
          ! grep -q 'admin-entry.js?v=' desktop/dist/index.html
          test -f desktop/dist/legacy-import.js
          grep -q 'site-entry.js' desktop/dist/index.html
          ! grep -q 'src="./app-v2.js?v=' desktop/dist/index.html
