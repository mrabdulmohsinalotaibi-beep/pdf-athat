name: PDF peer-transfer safety checks
on:
  pull_request:
    paths:
      - 'sync/**'
      - 'desktop/scripts/build-site.cjs'
      - '.github/workflows/pdf-peer-checks.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check sync/worker.js
          node --check sync/peer-client.js
          node --check desktop/scripts/build-site.cjs
      - name: Check no cloud PDF storage and isolated scope
        run: node sync/test-guardrails.cjs
      - name: Build offline site without enabling sync
        run: |
          cd desktop
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:offline
          node scripts/build-site.cjs
      - name: Assert offline-safe default build
        run: |
          grep -q 'PDF_ATHAT_SYNC_API=""' desktop/dist/sync-config.js
          test -s desktop/dist/peer-client.js
          test -s desktop/dist/peer.css
          test -s desktop/dist/index.html
