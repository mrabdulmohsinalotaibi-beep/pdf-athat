name: Build PDF.ATHAT Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'app-v2.js'
      - 'style.css'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/desktop.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: ubuntu-latest
            command: dist:linux
          - os: macos-latest
            command: dist:mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run test:offline
      - name: Test offline desktop workflows (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:electron
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate SHA-256 checksums for installers
        run: node scripts/checksums.cjs
      - name: Upload desktop failure screenshot
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-failure
          path: desktop/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-athat-${{ matrix.os }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Publish tested desktop pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: pdf-athat-*
          path: release-assets
          merge-multiple: true
      - name: Publish pre-release with installable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(find release-assets -type f -print -quit)"
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "PDF.ATHAT Desktop $GITHUB_REF_NAME" --notes "Offline PDF reader with a separate writable annotation layer. Windows, macOS and Linux installers are unsigned; test on your device and keep a backup of important files." --prerelease --verify-tag
