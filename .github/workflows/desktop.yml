name: Build PDF.ATHAT Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app-v2.js'
      - 'style.css'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - '.github/workflows/desktop.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: ubuntu-latest
            command: dist:linux
          - os: macos-latest
            command: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-athat-${{ matrix.os }}
          path: desktop/release/*
          if-no-files-found: error
